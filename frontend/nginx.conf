server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ai/ {
        proxy_pass http://ai-service:8000;
        proxy_set_header Host $http_host;
        proxy_read_timeout 600s;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_read_timeout 600s;
    }
}