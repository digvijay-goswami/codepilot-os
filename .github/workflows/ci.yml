name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit tests
        working-directory: ./backend
        run: mvn -B test -Dtest='ScoreCalculatorTest,GitHubServiceTest'
      - name: Build backend
        working-directory: ./backend
        run: mvn -B -DskipTests package

  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages and check syntax
        working-directory: ./ai-service
        run: |
          pip install -r requirements.txt pytest
          python -m py_compile main.py
      - name: Run unit tests
        working-directory: ./ai-service
        env:
          GEMINI_API_KEY: dummy-key-for-tests
        run: python -m pytest -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  docker-build:
    needs: [backend, ai-service, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t codepilot-backend ./backend
      - name: Build AI service image
        run: docker build -t codepilot-ai ./ai-service
      - name: Build frontend image
        run: docker build -t codepilot-frontend ./frontend