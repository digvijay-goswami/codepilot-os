server:
  port: ${PORT:8080}   # Render injects PORT

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/codepilot}
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5        # small: Render free = 512 MB, Neon free has limited connections
      connection-timeout: 60000   # Neon can take a few seconds to wake from idle
      max-lifetime: 240000        # recycle connections before Neon's 5-minute idle suspend
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000}

